# F0 (docs/strategy/implementation-roadmap.md): chi them cong cu, khong doi hanh vi runtime.
# Chi dong goi `aowbot` (src/aowbot, ADR-0013). bot/ va web/ KHONG cai vao site-packages: ten top-level qua
# chung chung (de dung ten voi goi khac); chung chay tu thu muc repo nhu truoc.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aowbot"
version = "0.1.0"
description = "Bot farm Age of Warpath tren LDPlayer (ADB + OpenCV + Tesseract)"
requires-python = ">=3.12"
# Giu dong bo voi requirements.txt (nguon cu, van dung duoc)
dependencies = ["opencv-python", "numpy", "pyyaml", "pytesseract", "flask"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "import-linter", "coverage"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
norecursedirs = ["tests/fixtures", "fixtures"]
markers = [
    "fixtures: can anh trong tests/fixtures/ (khong co trong git) - tu skip khi thieu",
    "ocr: can Tesseract cai tren may",
    "device: can LDPlayer that - khong bao gio chay trong CI",
]

# ---------------------------------------------------------------- ruff
# Cau hinh nay la muc NGHIEM cho ma moi (src/aowbot, tests). Ma cu (bot/, web/, tools/, main.py) chi kiem
# loi cu phap / ten chua dinh nghia bang lenh rieng (testing-strategy.md §4):
#   ruff check bot web tools main.py --select E9,F63,F7,F82
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bot", "web", "tools", "main.py", "poc", "templates", "data", "logs", "backups"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C90",      # do phuc tap vong
    "PL",       # pylint (gom so tham so)
    "BLE",      # except Exception rong
    "S110",     # try/except/pass
]
ignore = ["PLR2004"]  # so "ma thuat" trong test va toa do man hinh 540x960 la binh thuong

[tool.ruff.lint.per-file-ignores]
# test tham so hoa nhieu cot (bang chan tri) la binh thuong
"tests/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

# ---------------------------------------------------------------- mypy
# Chi kiem ma moi: `mypy src/aowbot` (tu B2a). Ma cu khong co type hint.
[tool.mypy]
python_version = "3.12"
files = ["src/aowbot"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# ma cu khong co type hint: chi kiem cho adapter dung no (infrastructure.legacy), coi nhu Any
module = ["bot", "bot.*", "web", "web.*"]
follow_imports = "skip"

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter (F2, docs/architecture/dependency-rules.md)
[tool.importlinter]
root_packages = ["aowbot", "bot", "web"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "D1-D3,D5: phan lop aowbot"
type = "layers"
layers = ["aowbot.app", "aowbot.interfaces | aowbot.infrastructure", "aowbot.application", "aowbot.domain"]

[[tool.importlinter.contracts]]
name = "D1: domain thuan"
type = "forbidden"
source_modules = ["aowbot.domain"]
forbidden_modules = ["bot", "web", "cv2", "pytesseract", "sqlite3", "subprocess", "flask", "yaml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "D2: application khong dung ha tang"
type = "forbidden"
source_modules = ["aowbot.application"]
forbidden_modules = ["bot", "web", "cv2", "pytesseract", "sqlite3", "subprocess", "flask", "yaml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "D4: chi infrastructure.legacy duoc vao bot"
type = "forbidden"
source_modules = ["aowbot.domain", "aowbot.application", "aowbot.interfaces", "aowbot.app", "aowbot.infrastructure.sqlite", "aowbot.infrastructure.clock"]
forbidden_modules = ["bot"]
allow_indirect_imports = true   # app dung adapter legacy (gian tiep toi bot) la hop le; cam import TRUC TIEP

[[tool.importlinter.contracts]]
name = "D7: ma cu chi duoc dung aowbot.domain"
type = "forbidden"
source_modules = ["bot", "web"]
forbidden_modules = ["aowbot.application", "aowbot.infrastructure", "aowbot.interfaces", "aowbot.app"]

[[tool.importlinter.contracts]]
name = "D5: interfaces khong dung truc tiep ha tang"
type = "forbidden"
source_modules = ["aowbot.interfaces"]
forbidden_modules = ["aowbot.infrastructure"]
