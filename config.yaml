# ===== Age of Warpath farm bot - cau hinh =====
ldplayer:
  ldconsole: 'D:\LDPlayer\LDPlayer9\ldconsole.exe'
  adb: 'D:\LDPlayer\LDPlayer9\adb.exe'
  boot_timeout: 120        # giay cho instance khoi dong
  game_package: 'com.ageofwarpath.globalwarzone.vn'  # vd 'com.xxx.ageofwarpath' - de trong thi bot tu do bang ldconsole/adb
  launch_wait: 45          # giay cho game vao thanh pho (toi da)
  launch_min_wait: 15      # cho toi thieu roi xem man hinh: thay thanh pho/popup la lam ngay
  max_running: 2           # toi da so may LDPlayer chay cung luc (ke ca may khong do bot bat)
  wait_slot_min: 60        # cho toi da N phut de co cho trong, qua thi bo qua may do
  screencap:               # A-OPT-3 (P1): phat hien may treo som - truoc day 1 lan chup hong mat ~190 s
    timeout_s: 5           # giay / 1 lenh screencap (binh thuong ~0,5 s). P9-1: 8 -> 5
    tries: 3               # so lan thu mac dinh moi lan chup
    budget_s: 15           # tong thoi gian toi da 1 lan chup (ke ca thu lai). P9-1: 30 -> 15
    max_timeouts: 2        # timeout lien tiep = may treo -> thoi thu
    reconnect_wait_s: 10   # do lai dia chi adb 1 lan; van hong -> cuu may (recover). P9-1: 15 -> 10
  recover: true            # P9-1: may treo (screencap hong sau do lai dia chi) -> ldconsole list2, khoi dong lai MAY + game
                           # (chi quit/launch/runapp - KHONG pm clear / uninstall / xoa du lieu) roi chay tiep buoc KE TIEP
  recover_max: 1           # so lan cuu toi da / luot; het -> bo luot may nay nhu truoc

# adb_serials: {0: '127.0.0.1:5555'}   # (tuy chon) dia chi adb rieng cho may; mac dinh emulator-(5554 + 2 x idx)
guide_follow: true         # sau moi buoc: game dang hien huong dan (ban tay / V) -> lam theo ngay
instances: [0, 1, 2, 3, 4, 5, 6]   # ID trong LDMultiPlayer. #1 = TAI KHOAN CHINH (cf30, them 2026-11-21; #7, #8 da xoa 2026-11-17)
screen: {width: 540, height: 960}   # game chay doc (portrait) - phai khop do phan giai LDPlayer
match_threshold: 0.82

# Bat/tat tung buoc cho moi tai khoan (chay theo thu tu nay)
modules:
  warday: true       # ngay chien tranh SVS (khien 8h/12h, cam thu thap) + moc the luc 0h/8h/15h UTC
  tutorial: false    # chi bat cho tai khoan moi
  shield: true       # P9-2: ngay thuong khien TAT -> bat som (Hiep uoc mien phi > vat pham > kim cuong trong tran 2000/ngay)
  mainquest: true    # UU TIEN: thanh nhiem vu chinh -> danh / xay / chien dich theo noi no dan toi
  collect_city: true # cham bieu tuong tai nguyen noi tren cong trinh
  alliance: true     # dong gop cong nghe lien minh bang vang, tro giup
  campaign: true     # chien dich: danh man ke tiep (nhiem vu 'Hoan tat Chien dich N') + nhan treo may
  notify: true       # cham do: phuc loi, hoat dong, tinh bao, chieu mo mien phi, tang cap tuong
  construct: true    # xay cong trinh MOI theo icon bua (cham do) goc phai duoi: keo the ra cho co trong, nut "Xay dung" (khong bam "Xay dung ngay")
  quests: true       # nhiem vu Chuong/Chinh: nut Den -> nang cap cong trinh (nha chinh <= build.hq_max_level)
  mission: true      # P7-7: su kien 'Su menh' - CHI tab Nhiem vu hang ngay + ruong mien phi Qua ky dieu (khong The thong hanh / San kho bau / goi tra phi)
  rewards: true      # nhan qua: thu, diem danh, VIP, qua mien phi (truoc nghien cuu/huan luyen de co them tai nguyen)
  research: true     # nghien cuu cong nghe nhanh thu thap
  train: true        # dao tao linh T3
  upgrade: true      # Q2: tho ranh -> nang nha chinh; thieu dieu kien -> 'Nhay' xay cong trinh dieu kien (HQ30 bo qua)
  rebels: true       # tham gia tap ket Phan quan Co giap (truoc khi gui quan)
  intel: true        # tinh bao moi luot (sau cham do, truoc gui quan) - thu tu that: ORDER trong bot/runner.py
  heal: true         # Q5: benh vien co thuong binh -> 'Hoi phuc' bang tai nguyen (khong bao gio 'Hoi phuc ngay')
  gather: true       # gui quan di mo - lap day moi doi hanh quan
  play: true         # Loi choi: nhan ruong Mo khoang san + Dau truong 3 luot mien phi (chi doi thu luc chien do)
  reddots: true      # cuoi luot: quet lai cot icon phai con cham do -> mo, chi nhan nut "Nhan" xanh (bo icon Qua $)
  daily: true        # nhan thuong nhiem vu + ruong nang dong (cuoi cung, sau khi cac buoc khac da tang tien do)

# G2 (docs/strategy/session-drain-proposal.md): sau luot ORDER, buoc lam duoc viec (nhan qua, xay moi...) mo khoa buoc da chay truoc
# no -> chay lai truoc observe thay vi doi lan ghe sau
drain:
  enabled: true
  max_extra: 8          # toi da so buoc chay lai moi lan ghe
  max_visit_min: 45     # qua thoi gian nay thi khong chay lai
priority:
  idle_first: true      # dau luot doc hang cho: tho xay 0/N, nghien cuu 0/N, huan luyen x/N -> lam truoc viec do (chu du an 2026-11-22)

rewards:
  # moi ten = 1 thu muc templates/rewards/<ten>/ (open_*, tab_*, claim_*) - xem templates/README.md
  # 'city' khong co open_*: nhan qua noi ngay tren thanh pho
  # signin (Diem danh 30 ngay) nam trong TT phuc loi -> do buoc notify.welfare nhan (2026-11-18, #5)
  # free_chest: chua tim thay ruong mien phi that (Ruong vat tu chien tranh: nut Mien phi bi khoa sau goi tra phi)
  routes: [mail, vip, celebration, city]
  use_vip_items: true     # Ruong ngay VIP can VIP: dung vat pham 'Thoi gian VIP' (nut Dung) - chu du an cho phep 2026-11-20; KHONG mua The thang
  use_vip_points: true    # P12-3 (t57u): bang 'Tang cap VIP' -> bam 'Dung' hang vat pham diem VIP DA CO, lap toi het; KHONG 'Mua va dung' / kim cuong
  max_taps_per_route: 30
  repeat_until_clear: true   # P7-3: tuyen thu lap toi khi icon thu het so do (nhan het, tab dau tien truoc)
  repeat_rounds: 4           # toi da so lan mo lai icon thu / icon qua lien minh moi buoc
  ally_gift: true            # P7-3: icon hop qua lien minh (so do) goc phai duoi -> nhan, lap toi khi het so
  require_dot: true    # chi mo tuyen khi icon open_1 co cham do ben canh (bo qua bang khong co qua)
  always_open: []      # tuyen luon mo du khong co cham do
  dot_tabs:            # tuyen co hang tab: cham tab theo cham do (x, y, w, h)
    mail: [0, 58, 540, 50]
    celebration: [[0, 250, 540, 30], [0, 306, 540, 30]]   # hang Ngay 1..5 -> hang muc con (Dang nhap / Tang cap / Chien dich)

daily:
  max_taps: 40       # gioi han so lan bam Nhan moi tab

gather:
  # alloy = Xuong Hop Kim, metal = Xuong Luyen Kim, oil = Xuong Loc Dau, food = Xuong Thuc Pham
  priority: [alloy, metal, food]  # alloy > metal > food (co the them oil)
  max_level: 8         # do mo tu cap 8 ha dan (chu du an 2026-11-21); tri nho cap thoa luu o gather_top:<loai>, do lai chi khi nha chinh/tuong len cap; hop kim thap nhat cap 3
  min_level: 1
  max_attempts: 40                # gioi han an toan moi tai khoan
  # so "x/y" trong khung "Hanh quan x/y" goc trai tren (x, y, w, h) - chi hien khi co doi dang di
  march_counter_roi: [150, 136, 50, 24]
  level_box: [292, 798, 30, 20]   # o so trong "Cap:" cua bang tim kiem
  node_xy: [270, 452]             # vi tri mo sau khi Tim kiem (ban do can giua mo vao day)
  only_full: true                 # tick "Chi tim kiem tai nguyen o diem tai nguyen day"
  load_ge_mine: true              # LUON: tai trong doi >= tru luong mo (doi cho het mo); khong thi bo qua, thu cap thap hon (chu du an 2026-11-19)
  min_mine_amount: 10000          # mo day doc ra < N hoac khong tron nghin = OCR sai -> doc lai / khong gui (2026-11-19 doc '606' cho mo ~800000)
  min_hq_level: 9                 # chua toi nha chinh cap 9 (du 3 nha linh) -> khong thu thap, lam nhiem vu can cu (chu du an 2026-11-19)
  node_amount_roi: [230, 521, 120, 17]  # dai chua "icon + so" con lai duoi mo (so can giua, doc bang mau xam)
  load_roi: [300, 843, 50, 18]          # "Tai trong quan doi: N" trong man Cai dat Quan doan
  travel_roi: [350, 905, 72, 15]        # dong ho duoi nut Xuat chinh
  # "Hanh quan x/y": auto = anh chu so templates/mdigits (P3) -> Tesseract -> templates/digits; glyphs | tesseract | digits | none
  ocr: auto
  tesseract_cmd: 'C:\Program Files\Tesseract-OCR\tesseract.exe'
  fallback_march_slots: 1   # khong doc duoc x/y (chua co doi nao di) -> gui toi da chung nay doi roi doc lai
  # --- P3 (PM 2026-11-23): thu thap day hanh quan ---
  infer_zero: true          # ban do the gioi KHONG co khung "Hanh quan" (anh mau gather/march_header) = 0 doi dang di -> 0/tong da biet
  # dung tich mo DAY theo cap 1..8 (null = chua biet -> phai doc so tren ban do). Chi dung khi only_full: OCR tru luong
  # hong / lech (vd '40000' cho mo 1040000) -> dung dung tich (lon nhat = an toan cho luat tai trong >= mo)
  mine_caps:
    metal: [40000, 80000, 160000, 320000, 560000, 800000, 1040000, 1320000]
    food: [40000, 80000, 160000, 320000, 560000, 800000, 1040000, 1320000]
    alloy: [null, null, 10000, 20000, 35000, 50000, 62500, 82500]
    oil: [null, 20000, 40000, 80000, null, 200000, 260000, 330000]
  contested_skip_min: 20    # hop thoai "Chi huy truong khac dang hanh quan den..." -> Huy, tam bo (loai, cap) N phut (KHONG bao gio Tiep tuc)
  occupied_skip_min: 30     # mo dang bi chiem (anh mau gather/mine_occupied) -> tam bo (loai, cap) N phut
  notfound_skip_min: 30     # tim kiem khong ra mo (loai, cap) -> tam bo N phut (truoc P3: moi lan ghe tim lai)
observe:
  read_hq: true            # doc cap nha chinh (cham avatar) khi gia tri da cu hon 6 gio

research:
  min_hq: 7               # So Cong Nghe vao duoc tu Xuong kien truc cap 7 (anh chu du an 2026-11-22)
  use_help: true
  use_free_speedup: true
  max_starts: 2           # CHUA DUNG: research.py chua doc khoa nay (2026-11-21, A-CFG-1)
  # P2 (PM 2026-11-23): chon node theo uu tien + xu ly het tai nguyen (bot/modules/research.py pick_and_start)
  branch_order: [0, 1, 2] # thu tu nhanh: 0 Phat trien, 1 Dao tao, 2 Quan su (trong nhanh: tren -> duoi)
  pages_per_branch: 4     # so lan cuon xuong moi nhanh
  max_nodes_per_run: 3    # toi da so node bam thu ma khong bat dau duoc trong 1 luot
  node_skip_h: 6          # node bam vao khong lam duoc gi (khong nhan ra bang / chuoi qua dai) -> bo qua N gio
  nores_backoff_min: 60   # thieu tai nguyen -> khong mo lai 60 phut, lap lai thi gap doi
  nores_cap_h: 6          # ... toi da 6 gio
  max_s: 150              # toi da N giay cho phan chon node moi luot

train:
  # vao nha linh qua bang "Doi ngu huan luyen" (nut Den) -> tu dong ca 1..3 nha linh dang ranh
  tier: 3               # cap muon huan luyen; chua mo khoa thi tu ha cap
  only_for_gather: true # chi luyen T3 toi khi co >= so doi hanh quan x troops_per_march
  troops_per_march: 1200 # so linh T3 can cho 1 doi thu thap
  min_tier: 1           # khong huan luyen thap hon cap nay
  card_x: [100, 205, 308, 410]   # toa do x the cap I..IV tren man 540x960
  card_y: 695
  max_queues: 4         # so nha linh toi da moi luot
  use_max_button: false # chu du an 2026-11-23: thanh so luong mac dinh da toi da -> khong can nut / anh mau train/btn_max
  nores_backoff_min: 30 # P2: bam 'Huan luyen' ma khong bat dau (thieu tai nguyen) -> khong mo lai 30 phut, lap lai gap doi
  nores_cap_h: 4        # ... toi da 4 gio
  use_help: true
  use_free_speedup: true

cycle:
  loop_forever: true
  pause_between_cycles_min: 30   # nghi giua 2 vong qua het tai khoan (chi dung khi schedule.mode = fixed)

# Dieu huong theo nhan dien man (bot/screens.py, giai doan B): ensure_city/ensure_world dung ctx.goto();
# false = cach cu (back_out + nut chuyen ban do). Man la luu vao logs/unknown/ de dan nhan.
nav:
  smart: true
  skip_recheck_s: 3.0   # G3: ensure_city ngay sau 1 lan da xac nhan thanh pho (khong thao tac o giua) thi bo qua; 0 = tat

# Lap lich theo tri nho (bot/scheduler.py, docs/product/ke-hoach-A-tri-nho-lap-lich.md)
# fixed = nhu cu (chay het may, het buoc, nghi pause_between_cycles_min); smart = chi bat may khi can
# XAY NHA / THU THAP / NGHIEN CUU (chu du an chot 2026-11-19), buoc khac chay kem
schedule:
  parallel: 2             # so may xu ly cung luc (<= ldplayer.max_running); 1 = lan luot nhu cu
  parallel_stagger_s: 20   # bat may thu 2 cach may thu 1 N giay
  mode: fixed
  max_gap_min: 240        # tran an toan: qua N phut khong ghe -> van vao 1 lan, chay moi buoc (chu du an chot 2026-11-19)
  min_gap_min: 10         # 2 lan ghe cung may cach nhau it nhat N phut
  batch_window_min: 5     # viec den han trong N phut toi -> lam luon trong lan ghe nay
  idle_check_min: 15      # khi khong may nao den han: tinh lai lich moi N phut
  gather_retry_min: 60    # gui xong ma van con doi ranh (khong co mo vua tai trong / het linh) -> thu lai sau N phut
  unknown_return_min: 60  # doi dang di ma OCR khong doc duoc dong ho: uoc luong ve sau N phut (khi chua du lich su; co lich su thi lay phan vi 25 %)
  build_every_min: 120    # chua doc duoc gio xay xong -> kiem tra xay moi N phut
  build_backoff: true     # tho ranh ma cac lan ghe truoc khong xay duoc gi -> gian chu ky min_gap x2 moi 2 lan, toi da build_every_min (A-FIX-3)
  research_every_min: 120 # chua doc duoc gio nghien cuu xong -> kiem tra moi N phut
  tutorial_every_min: 30  # TK dang bat tan thu: ghe toi da moi N phut
  research_hq_min: 7      # nghien cuu mo tu nha chinh 7 (#0 2026-11-22: So Cong Nghe Cap 1 vao duoc o HQ 7; truoc day 8)
  daily_reset_utc: 0      # reset ngay cua server (0h UTC = 7h VN)
  backoff_base_min: 30    # buoc loi/ket lien tiep -> tam bo 30, 60, 120... phut
  backoff_cap_h: 6        # toi da tam bo N gio
  extra_every_min: 180    # buoc chay kem (qua, cham do...) toi thieu cach nhau N phut (x2/x4 khi trang tay lien tiep)

# Watchdog: phat hien ket -> luu anh logs/shots/*_stuck.png, force-stop game (KHONG xoa du lieu), mo lai, sang buoc ke
watchdog:
  enabled: true
  still_min: 5          # man hinh khong doi qua N phut (trong luc module dang chup man hinh)
  diff_th: 2.0          # do lech trung binh anh thu nho 54x96 (0-255) de coi la "da doi"
  step_max_min: 20      # 1 buoc chay qua N phut -> coi la ket
  step_max_override: {tutorial: 120, mainquest: 30, reddots: 30}
  max_restarts: 2       # qua so lan khoi dong lai trong 1 luot -> bo tai khoan nay, sang may ke

# ===== Xay dung / nhiem vu / phong thu =====
build:
  hq_targets: [9, 15]  # P4: muc tieu nha chinh farm (9 = du 3 nha linh/thu thap, 15 = phan quan); duoi muc tieu -> dong NV "Xuong kien truc" lam truoc
  hq_max_level: 30     # khong nang nha chinh qua cap nay (chu du an 2026-11-21: xay o moi cap; HQ30 = toi da -> bo muc tieu xay)
  max_builders: 1      # so tho xay dung duoc (farm 1; TK chinh #1 = 2, dat rieng tren web/settings) - chu du an 2026-11-21
  recenter_world: true # P13-1: truoc khi cham nha chinh -> ra the gioi roi vao lai thanh pho (camera dat nha chinh giua man)
  follow_quests: true  # xay/nang nha theo nut "Den" cua nhiem vu
  quick_s: 660         # xay xong trong <= N giay (thanh tien do tren thanh pho) -> cho xong roi xay tiep lien tuc; 0 = tat
  quick_total_s: 1800   # tong thoi gian cho xay nhanh moi luot ghe
quests: {daily: true, main: true, alliance: true, story: true, max_go_per_run: 6,
         follow: true,      # dong Chuong khong phai xay (tuong, don phe tich...) -> lam theo huong dan game (tutorial.decide)
         follow_steps: 40,  # so buoc toi da moi dong
         read_rows: true,   # P4: OCR ten dong, dong la viec cua buoc khac (huan luyen, phan quan, dau truong...) -> khong bam Den
         none_retry_h: 2,   # S2: dong "Den" khong dan toi man nang cap, game khong bao ly do -> thu lai sau N gio
         claim_when_off: true}  # P7-5: tat buoc quests tren may (vd #1) -> van CHI nhan thuong o tab co cham do, khong bam Den
                            # (co thong bao: lo dat chua mo 12 h, thieu cong trinh dieu kien 6 h - aowbot/domain/blockers.py)
notify:
  welfare: true
  welfare_daily_check: true  # P10-6: moi luot log Diem Danh 30 Ngay / Qua dang nhap (da nhan -> bo nhanh; chua kiem hom nay -> mo TT phuc loi 1 lan)
  bubble: true
  activity: true
  intel: true
  intel_max: 20           # so nhiem vu tinh bao toi da / luot (lam het neu du nang luong + thuoc)
  intel_max_potions: 20   # so Thuoc The Luc toi da / luot (dung tung vien khi thieu)
  intel_use_potions: true  # het nang luong tinh bao -> dung Thuoc The Luc (khong bao gio Mua bang kim cuong)
  intel_only_gold: false   # chi lam ghim tinh bao VANG + TIM dau lau (nhiem vu cao cap); #1 bat (chu du an 2026-11-21)
  intel_pickup_max: 2      # P7-4: hop qua tinh bao (moi mau) toi da 2 hop dang nhat cung luc; cho nhat xong moi nhat tiep
  intel_pickup_s: 90       # P7-4: uoc luong giay nhat 1 hop (tick xanh som hon -> giai phong cho som)
  intel_pickup_wait_max_s: 120  # P7-4: day 2 hop -> cho toi da N giay, lau hon thi bo ghim hop nay (lan sau)
  intel_rescans: 3         # P7-4: lam xong nhiem vu co the sinh diem moi -> quet lai ban do toi da N lan
  intel_rescan_wait_s: 3   # P7-4: cho diem moi hien truoc khi quet lai
  recruit: true
  hero: true
  events: true            # o su kien cot phai (nhan qua an toan)
heal:                      # buoc benh vien (bot/modules/heal.py) - chi nut "Hoi phuc" bang tai nguyen, KHONG BAO GIO "Hoi phuc ngay"
  open_without_bubble: false  # P5-3: khong thay bong bong chua tri + lan ghe chua co tran -> khong mo benh vien (true = mo kiem nhu cu)
stepgate:                  # P1 "On dinh nen" (bot/stepgate.py): dieu kien truoc khi chay + gian chu ky khi tra 0
  enabled: true
  steps: [heal, campaign, warday, mainquest]   # buoc duoc kiem dieu kien / gian chu ky
  after: 2                 # tra 0 (chay ok ma khong lam duoc gi) N lan lien tiep -> bat dau gian
  base_min: 60             # tam bo base x 2^(lan - after) phut...
  cap_h: 8                 # ... toi da N gio. Lam duoc viec (tra > 0) -> xoa. Luu theo may: fact idle:<buoc>
  max_skip_h: 6            # bo vi dieu kien (khong thay thuong binh, luc chien chua du...) qua N gio -> chay 1 lan kiem tra
reddots:
  max_rounds: 6        # lap toi khi het cham do; dung som neu 1 vong khong nhan them duoc gi
  skip_idle_steps: true  # cham do cua icon ma buoc rieng vua chay trong lan ghe nay va tra 0 -> khong mo lai
  dead_h: 2            # cham do mo ra khong nhan duoc gi -> bo qua vi tri do N gio (lap lai thi gap doi...)
  dead_cap_h: 24       # ... toi da N gio (lam duoc viec o vi tri do -> dem lai tu dau)
  max_s: 240           # A-OPT-1 (PM 2026-11-23): toi da N giay moi lan quet (0 = khong gioi han). P9-2: 90 -> 240
                       # (live-run-2: het 90 s con 14 cham do; P9-3 nhan HET cham do moi man - can them thoi gian)
  min_interval_min: 30 # moi may toi da 1 lan / N phut, tru khi notify vua nhan duoc qua hoac co cham do MOI
  claim_grace_s: 90     # P10-5: het max_s van lam them N giay cho cham do NHAN QUA (thu, qua lien minh, VIP, Qua, chieu mo)
  final_claims: true    # P10-5: truoc observe quet lai thu (moi tab co cham do, ca Bao cao) + qua lien minh + chieu mo
                        # (live3: tran tinh bao / dau truong / thu thap sinh thu bao cao MOI sau buoc reddots)
  chat_clear: true      # mo roi thoat bang Tro chuyen de mat huy hieu tin nhan chua doc (chi doc, khong gui) - chu du an 2026-11-22
recruit:
  use_tickets: false   # chi chieu mo mien phi; true = dung ca phieu (KHONG BAO GIO kim cuong)
construct:            # xay cong trinh MOI qua icon bua (bot/modules/construct.py)
  max_per_run: 6      # toi da so lan xay moi moi luot
  roads: true         # P12-5 (t56u): icon vien gach canh cong trinh thieu duong -> bam -> 'Xac nhan' 20 thoi vang; chi phi kim cuong -> Huy
  # P2 (PM 2026-11-23): the khong dat duoc (construct_no_spot / khong tick / thieu tai nguyen) -> nho, sang the/nhom khac
  max_fail_per_run: 2   # toi da so lan keo the that bai trong 1 luot (moi lan ~30 s), sau do nhuong tho cho nang cap
  nospot_backoff_h: 2   # the hong bi bo qua 2 gio, hong lai thi gap doi (thieu tai nguyen/tho: 1 gio)
  nospot_cap_h: 24      # toi da 24 gio; nha chinh len cap -> thu lai ngay (thanh pho co the rong them)
  empty_recheck_h: 1    # bua co cham do ma khong co the nao mo -> N gio sau moi mo lai bang Xay dung
mainquest:
  max_steps: 6
  fight_unpredicted: false # boss qua kho: khong danh khi man doi hinh khong ghi 'Thang toan dien'
  power_gain_pct: 5        # bo qua/thua -> lam nhiem vu tang suc manh, thu lai khi luc chien tang >= 5%
  busy_recheck_h: 2        # cong trinh cua nhiem vu dang xay ma khong doc duoc gio xong -> kiem tra lai sau N gio
  # P4 (PM 2026-11-23): doc chu thanh nhiem vu (OCR) -> phan loai (bot/quest_rules.py). Viec cua buoc khac (tap ket,
  # huan luyen, tinh bao, dau truong...) -> KHONG cham thanh nhiem vu (truoc: follow cham giua ban do toi ket).
  read_banner: true
  npc_rebels: true         # "Kich sat N lan phien quan": cham muc tieu -> "Tan cong" -> Xuat chinh (phien quan NPC, khong phai nguoi choi)
  npc_max_level: 10        # chi danh phien quan cap <= N
  npc_max_ratio: 0.3       # ... va luc chien de xuat <= luc chien minh x 0.3
  same_retry_h: 1          # cung nhiem vu that bai 2 lan lien -> cho N gio moi cham lai (gap doi moi lan)
  same_retry_cap_h: 8      # ... toi da N gio (nhiem vu doi = thu ngay)
tutorial:
  # tran tan thu thua lien max_retry lan (vd danh muc tieu "That bai nang ne") -> tam dung tan thu
  power_gain_pct: 5        # danh lai khi luc chien tang >= 5% (cac buoc train/tuong/qua tang suc manh)
  weak_retry_h: 6          # hoac sau N gio (khi khong doc duoc luc chien)
  trace_dir: ''            # (tuy chon) luu anh + quyet dinh tung buoc tan thu vao thu muc nay de xem lai
world:
  min_hq_level: 6         # nha chinh < 6: ban do the gioi chua mo -> bo thu thap/phan quan/doc hanh quan
  recheck_h: 6            # nut chuyen ban do khong an -> N gio sau moi thu lai
# Agent theo muc tieu (src/aowbot, docs/strategy/MASTER-IMPLEMENTATION-PLAN.md). TAT mac dinh.
# Bat cho 1 may: data/settings.json -> "instances": {"1": {"schedule": {"mode": "agent"}}} (vong chung phai la smart).
# May o che do agent: hanh quan do agent quyet dinh (doi ve -> chon mo -> gui 1 doi -> xac minh x/y -> hen su kien ke);
# cac viec khac van theo lich smart cu. Xem quyet dinh: python -m aowbot plan <idx> / shadow <idx>.
agent:
  enabled: false             # P6 CONG TAC CHUNG: false = khong may nao chay agent (may chon 'Agent' tren web chay lich chung).
                             # Chi chu du an bat (web: Tuy chon -> Agent). Tat = dung khan cap agent tren moi may.
  ttl_min: {default: 30, hq_level: 360, march_used: 20, march_total: 1440, world_open: 360}  # qua TTL = du lieu cu
  weights: {goal: 1.0, time: 0.5, risk: 0.5}   # utility = (muc tieu - thoi gian - rui ro) x do tin
  idle_recheck_min: 60       # khong biet bao gio co viec -> danh gia lai sau N phut
  min_state_confidence: 0.5  # du lieu lam co so duoi muc nay -> khong hanh dong tac dong (quan sat truoc)
perf:                      # A-MEAS-1: dem so lan + thoi gian lenh adb / chup anh / OCR / nhan dien man theo buoc -> bang perf (memory.db)
  enabled: true            # false = tat (khong anh huong thao tac)
speed:
  wait_scale: 0.75         # nhan thoi gian cho sau moi lan cham (1.0 = nhu cu; giam neu may nhanh, tang neu hay lo man)
demo:                      # che do HOC MAU (bot/demo.py): may co schedule.mode = demo (dat theo may tren web)
  idle_min: 3             # ban ngung thao tac N phut -> ket thuc lan hoc mau
  max_min: 60             # toi da N phut moi lan
  keep_open: false          # xong khong tat may (ban co the dang choi tiep)

follow:                    # che do LAM THEO MAU (bot/imitate.py): may co schedule.mode = follow
  max_actions: 80          # toi da N thao tac moi lan
  max_min: 30              # toi da N phut moi lan
  max_repeat: 4            # 1 thao tac mau dung qua N lan trong 1 lan chay -> chan (chong lap vong)
  wait_s: 1.2              # cho sau moi lan cham

learn:                     # giai doan E+F (docs/bot/05-ke-hoach-hoc-may-mini.md, bot/learn.py)
  enabled: true            # ghi kinh nghiem moi lan cham (bang exp, data/exp/crops) + hoc
  explore: true            # man la: cham theo hang xom kNN / cham thu nut dong 'gan khop' (chi nut dong/quay lai)
  near_lo: 0.65            # diem khop toi thieu de cham thu nut dong 'gan khop'
  promote_ok: 2            # cham thu dung N lan (khong lan nao sai) -> nhan bien the anh mau
  dead_min: 8              # cho cham >= N lan ...
  dead_rate: 0.1           # ... ma ti le an < 10% -> 'cho chet', goto dung Back thay vi cham
  stats_days: 14           # thong ke ti le an theo N ngay gan nhat
  adaptive_wait: true      # H1: cho sau cham theo thoi gian game phan ung da hoc (p80 + 0,35 s, khong vuot thoi gian cu)
  knn_max: 6000            # so mau kNN man hinh toi da nap tu memory.db
  dup_sim: 0.985           # mau moi giong mau cu cung nhan hon muc nay -> khong luu (giu kNN gon)
  watch_human: true        # chu du an cham/keo tay tren may bot dang chay -> chup anh truoc/sau -> logs/human/ (buoc 'co anh loi')
human_pause:               # P9-1 (live-run-2): chu cham tay lien tiep -> bot TAM DUNG, khong giam len thao tac cua chu
  enabled: true
  taps: 3                  # >= 3 thao tac tay (da loc cham cua bot) ...
  window_s: 20             # ... trong 20 giay -> tam dung
  quiet_s: 30              # chay lai khi tay yen 30 giay
  max_wait_min: 10         # cho toi da 10 phut / lan tam dung
battle:
  steer: true         # giu ngon tay tren doi quan: nhat buff, ne bang do/vong do/vet xe lao
  debug_dir: 'logs/steer'  # luu khung hinh + trace.csv moi tran (bat 2026-11-20 de xem loi 'khong di chuyen trai phai'; '' = tat)
  enter_wait_s: 25    # P7-9: cho xac nhan vao tran chien dich toi da N giay (live #1: 10 s khong du -> khong lai, thua); khong xac nhan -> anh logs/inv/steer_no_battle/
campaign:
  max_fights: 5            # so man toi da moi luot
  only_predicted_win: true # chi danh khi bang man ghi 'Thang toan dien'
  power_gain_pct: 5        # P1: khong du doan thang -> chi mo lai Chien dich khi luc chien tang N %
  idle_claim_h: 8          # ... hoac khi Loi ich treo may da tich N gio (mo de nhan)
alliance:
  donate_max: 10       # so lan quyen gop (VANG) moi luot
  boss: true           # BOSS lien minh: nhan ruong muc sat thuong (cham do), khong khieu chien
  mine: true           # Mo lien minh "Den thu thap": gui 1 doi neu con doi ranh
  territory: true      # P7-2: Lanh tho > "Tranh Doat Cu Diem" > "Nhan" loi nhuan tai nguyen moi lan dang nhap (anh mau ally/tab_territory, ally/btn_contest)
  gifts: true          # P7-2: o "Qua tang lien minh" > Qua dac biet + Qua thuong "Nhan toan bo" LAP toi het
  gift_loop_rounds: 30 # P11: qua lien minh LAP den het (2 tab): toi da N vong nhan -> lam moi tab -> doc lai so do
  gift_loop_max_s: 180 # ... hoac N giay cho ca buoc; cham tran -> log con bao nhieu, thoat ve thanh pho
  gift_stall_rounds: 2 # so khong giam + khong nhan duoc N vong lien tiep -> anh logs/shots + dung tab (chong ket)
mission:                  # P7-7 su kien "Su menh" (icon ben phai man thanh pho) - anh mau templates/mission/
  max_claims: 12          # so nut Nhan toi da o tab Nhiem vu hang ngay
  free_gift: true         # Qua ky dieu: ruong nho goc tren-trai (co dong ho) nhan MIEN PHI khi co cham do
loot:                     # Cuop boc xe khai thac (Mo khoang san) - chu du an lam mau 2026-11-21
  enabled: true
  rarity: [SSR, SR]       # chi xe CAM (SSR) va TIM (SR)
  daily: 4                # 4 luot / ngay (game dem "So lan cuop boc con lai: N/4")
  reset_utc: 4            # reset 4h UTC
  margin: 0.97            # bo doi thu >= 97 % nguong da thua
  crystal_only: true      # P7-6: chi cuop xe cho vat pham PHA LE XANH (anh mau play/item_crystal; chua co -> theo mau)
  refresh_max: 3          # P7-6: chua co xe SR/SSR pha le -> bam lam moi (mui ten tron, play/btn_refresh) toi da N lan / luot;
                          #       bam ma hien hop thoai khac (ton phi?) -> dong, khong xac nhan, dung lam moi
  power_margin: 0.0       # P8-2: chi bam "Chien dau" khi luc chien ta (man doi hinh, sau "Doi hinh de xuat") > ho ve
                          #       va ta >= ho ve x (1 + power_margin); doc khong duoc so nao -> bo xe (khong danh mo)
  max_attempts: 2         # P8-2: bo xe o man doi hinh (ho ve manh hon) -> ve Mo khoang san thu xe khac, toi da N lan / luot
mine_trucks:              # P9-6 (chu du an 2026-11-24): Mo khoang san > "Xe khai thac cua toi" - dua xe cua minh di toi het X/4
  enabled: true
  min_support_power: 400000000   # xe SR/SSR co tinh the: chi moi ho tro lien minh luc chien > 400M; khong ai -> de xe trong
  refresh_max: 3          # lam moi (vong vang) toi da N lan / xe, CHI khi "Mien phi" hoac con luot (a/b, a < b); "1/0" = het
  max_trucks: 4
  support_pages: 4        # so trang luot danh sach Doi quan ho tro lien minh
arena:                    # Dau truong (Loi choi) - chu du an 2026-11-21
  enabled: true
  max_fights: 3           # 3 luot "Khieu chien mien phi" / ngay; khong bao gio mua luot
  weaker_only: true       # P7-10: CHI danh doi thu luc chien YEU HON minh (mau do khong mien)
  refresh_max: 3          # P7-10: khong co doi thu yeu hon -> "Lam moi" (play/btn_arena_refresh) toi da N lan; nut co so/kim cuong -> khong bam
  only_red_power: false   # true = chi danh doi thu chu luc chien mau do (game hien chu trang -> tat)
  max_ratio: 1.0          # chi danh doi thu luc chien <= luc chien minh x ti le nay (manh nhat trong so do)
  lost_days: 7            # nho doi thu da thua (theo luc chien +-3%) N ngay -> khong danh lai
rebels:
  start_level: 10        # Q6: chua thang cap nao -> tim Co giap cap nay qua o tim kiem; thang N -> lan sau N+1, du doan thua -> lui
  type_level: true       # P7-10: tim Co giap: go so truc tiep vao o "Cap" (khong doc lai dung -> bam +/-)
  join_mech_rally: false  # THAM GIA tap ket Co giap cua lien minh - TAT mac dinh (PM 2026-11-23: chu du an chua quyet);
                          # bat cung can anh mau rebels/rally_mech + rebels/btn_join (thieu -> bo qua, log 'thieu anh mau')
  min_stamina: 0
  min_hq_level: 15        # chu du an 2026-11-21: tu nha chinh cap 15 moi danh Phan quan tap kich
  daily_target: 5         # hoan thanh 5 luot moi ngay (reset 0h UTC) -> du thi bo buoc
  every_min: 60           # chua du 5 luot -> keo may len toi da moi N phut
  attack: true            # TU MO tap ket danh Phan quan Co giap (3 phut, quan doan -> Xuat chinh khi du doan thang)
  legion: Odin            # quan doan mac dinh (Odin/Thor/Loki/Hawk/Hulk); bot nho quan doan da thang
  fail_h: 12              # cap du doan khong thang -> khong thu lai cap do trong N gio (lui ve cap da thang)
  search_tries: 3         # P5-2: so cap thu trong 1 luot (cap ke tiep roi ha dan khi du doan thua / khong tim thay)
  intel_rally_min_hq: 0   # P5-2: ghim tinh bao Phan quan Co giap tu mo tap ket chi khi nha chinh >= N (0 = moi cap, nhu cu)
warday:
  # Lich tuan su kien (chu du an 2026-11-23): thu 7 = ngay chien tranh (giu khien LIEN TUC du 24h), thu 2 = ngay thu thap.
  enabled: true
  mode: auto                # CONG TAC TAY (web: Tuy chon -> Ngay chien tranh): auto = theo lich + dau hieu; on = coi HOM NAY la
                            # ngay chien tranh (giu khien ngay); off = khong co ngay chien tranh (chi khi chac chan)
  weekdays: [5]             # ngay chien tranh trong tuan (0 = thu 2 ... 5 = thu 7, 6 = chu nhat)
  reset_hour_utc: 0         # gio reset server (UTC): ngay chien tranh = [reset thu 7, reset chu nhat)
  gather_weekdays: [0]      # ngay thu thap: gather chay dau luot, khong de danh quan doan cho phan quan
  stamina: true             # dang nhap dung moc 0h, 8h, 15h UTC de nhan the luc
  stamina_delay_min: 1      # ghe sau moc N phut
  timed_login: true         # P7-11: su kien "Dang nhap hen gio" (5 the luc / khung) - lich keo moi may len trong khung
  timed_login_windows_utc: [[18, 19], [8, 9]]   # = 01:00-02:00 va 15:00-16:00 gio VN
  timed_login_delay_min: 2  # ghe sau dau khung N phut
  # P8-3 (chu du an 2026-11-24): khung 1 gio DU cho ca 7 may -> runner bat may NGAY dau khung, toi da 2 may cung luc,
  # luot NGAN: ruong "Dang nhap hen gio" DAU TIEN roi cac buoc duoi neu con thoi gian, tat may nhuong cho may sau
  timed_login_visit_max_min: 12          # luot ngan: qua N phut (tinh tu luc bat may) thi bo cac buoc con lai
  timed_login_steps: [warday, notify, rewards]   # buoc chay sau ruong trong luot ngan (buoc tat o may van tat)
  timed_login_yield: true   # may dang chay luot dai khi khung mo: nhan ruong o buoc ke tiep, con may cho -> ket thuc som
  lead_h: 2                 # mo cua so (bat khien) truoc gio reset N gio
  tail_min: 30              # giu cua so them N phut sau khi het ngay (khong chac -> giu khien)
  renew_before_min: 20      # khien con <= N phut thi gia han
  peace: true               # Hiep uoc hoa binh (mien phi, chuan bi 1h, bao ho 8h, hoi 14h) dung truoc gio chien tranh
  peace_prep_min: 60
  peace_hours: 8
  peace_cooldown_h: 14
  buy_gems: true            # chu du an 2026-11-23: ngay chien tranh het vat pham thi MUA khien bang kim cuong
  gem_cap: null             # tran kim cuong trong ngay chien tranh: null = KHONG GIOI HAN (chu du an 2026-11-23)
  banner_ocr: false         # doc banner 'Giai doan N' tren ban do the gioi (vung OCR chua kiem tren may 540x960)
  dates: []                 # ngay chien tranh khai tay "YYYY-MM-DD" (them vao lich, khong thay lich)

shield:                   # P9-2 (chu du an 2026-11-24): khien som ngay thuong, doc lap voi warday (thu 7 warday lo)
  buy_gems: true          # het Hiep uoc + vat pham -> mua bang kim cuong TRONG tran defense.gem_cap_daily (2000/ngay)
  peace_prep_min: 60      # Hiep uoc vua dung (chuan bi 1h) -> khong bat/mua khien khac trong N phut
  renew_below_min: 60     # P10-7: dau + cuoi luot, khien con < N phut -> gia han (vat pham > kim cuong trong tran);
                          # Hiep uoc chi khi khien con >= peace_prep_min (khong ho luc chuan bi); con >= N -> khong chong
defense:
  shield_on_attack: true  # bi tan cong -> bat khien
  shield_hours: 1
  shield_buy_gems: true   # het vat pham khien thi mua bang kim cuong
  gem_cap_daily: 2000     # tran kim cuong moi ngay moi tai khoan
  evacuate_troops: false  # gui toan bo quan ra khoi tru so di thu thap
  red_flash: true         # mep man hinh nhay do o thanh pho/ban do = dang bi tan cong (chua co anh mau canh bao)
